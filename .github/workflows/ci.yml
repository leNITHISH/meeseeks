name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25 # a hung test must not hold a runner for hours
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest, cc: clang }
    steps:
      - uses: actions/checkout@v4
      - name: Build (release, debug)
        run: |
          make CC=${{ matrix.cc }}
          make CC=${{ matrix.cc }} debug
      - name: Test suite
        run: make CC=${{ matrix.cc }} test
      - name: Benchmark smoke run
        run: make CC=${{ matrix.cc }} bench-quick BENCH_DIR=./bench-data

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Line coverage of src/ by the test suite
        run: make coverage | tee coverage.txt
      - name: Summary
        run: |
          grep -E '\.c: ' coverage.txt >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: fuzz (libFuzzer, 60 s per target)
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a hung test must not hold a runner for hours
    steps:
      - uses: actions/checkout@v4
      - name: Lower ASLR entropy for the sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Fuzz
        run: make fuzz FUZZ_TIME=60
      - name: Keep any crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*

  sanitizers:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 25 # a hung test must not hold a runner for hours
    strategy:
      fail-fast: false
      matrix:
        mode: [asan, tsan]
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 24.04 runners use 32 bits of mmap ASLR entropy, which the
      # sanitizers' fixed shadow-memory layout cannot cope with.
      - name: Lower ASLR entropy for the sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Test suite under ${{ matrix.mode }}
        run: make test-${{ matrix.mode }}
